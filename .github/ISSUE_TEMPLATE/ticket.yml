name: Ticket
description: Un ticket au modèle de la charte, en français. Le type se choisit dans la case « Type » de la colonne de côté.
body:
  - type: markdown
    attributes:
      value: |
        Chaque rubrique dit quelque chose de vérifiable : une mesure, une commande, un critère avec sa preuve. Une rubrique sans objet s'écrit « sans objet », avec son motif. Le corps du ticket est le contrat : une fois le ticket lancé, le responsable n'y modifie que les cases de la route et la liste « Hygiène » ; tout le reste se dit dans les commentaires.
  - type: textarea
    id: demandeur
    attributes:
      label: Qui a demandé, avec ses mots
      description: Le nom du demandeur, la date, et sa demande citée telle qu'elle a été dite.
    validations:
      required: true
  - type: input
    id: responsable
    attributes:
      label: Responsable nommé
      description: Le responsable ou la séance qui exécutera ce ticket.
    validations:
      required: true
  - type: textarea
    id: resume
    attributes:
      label: Résumé
      description: Ce qu'il faut faire, en deux ou trois phrases.
    validations:
      required: true
  - type: dropdown
    id: classe-de-valeur
    attributes:
      label: Classe de valeur
      description: Si ce ticket est fini, qu'est-ce qui change demain matin ? Choisis la première classe qui s'applique.
      options:
        - Ça rapporte
        - Ça se sent
        - Ça débloque
        - Ça protège
        - C'est interne
    validations:
      required: true
  - type: textarea
    id: pourquoi
    attributes:
      label: Pourquoi
      description: La raison d'être du ticket, et ce qui se passe s'il n'est pas fait.
    validations:
      required: true
  - type: textarea
    id: aujourdhui
    attributes:
      label: Aujourd'hui
      description: L'état réel, mesuré, avec la commande ou la source de chaque chiffre et sa date.
    validations:
      required: true
  - type: textarea
    id: voulu
    attributes:
      label: Voulu
      description: La cible, chiffrée quand c'est possible.
    validations:
      required: true
  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: |
        Une liste. Chaque critère est binaire et porte sa ligne « Vérifié par » (une commande, une mesure, un contrôle). Un critère a trois états : vérifié, non vérifié, ou révoqué.
      placeholder: |
        - Le critère, en une phrase.
          Vérifié par : la commande, la mesure ou le contrôle.
    validations:
      required: true
  - type: textarea
    id: route
    attributes:
      label: Route
      description: Les grandes étapes, dans l'ordre, une par case, et les gestes sensibles qu'elles portent. Le responsable coche chaque case quand l'étape est faite. Un petit ticket sans enjeu tient en une ligne.
      value: |
        - [ ] Étape 1
        - [ ] Étape 2
        - [ ] Étape 3
    validations:
      required: true
  - type: textarea
    id: hors-perimetre
    attributes:
      label: Hors périmètre
      description: Ce que ce ticket ne fait pas, et où cela va.
    validations:
      required: true
  - type: checkboxes
    id: gestes-sensibles-liste
    attributes:
      label: Gestes sensibles prévus, à cocher
      description: Coche chaque point d'arrêt que ce ticket prévoit. Ne coche rien si le ticket n'en porte aucun.
      options:
        - label: Créer, remplacer ou afficher un secret
        - label: Supprimer un fichier suivi par Git, ou le déplacer hors du périmètre du ticket
        - label: Arrêter ou redémarrer un service partagé en production
        - label: Envoyer quelque chose à un tiers (un mail, un message, un paiement)
        - label: Changer le schéma d'une base partagée
  - type: textarea
    id: gestes-sensibles
    attributes:
      label: Gestes sensibles prévus, conditions
      description: Pour chaque geste prévu, ses conditions (par exemple « une fois, entre 14 h et 18 h »). Le feu vert est donné une fois, au lancement, pour toute la liste. Écris « aucun » s'il n'y en a pas.
    validations:
      required: true
  - type: textarea
    id: contraintes
    attributes:
      label: Contraintes d'exécution
      description: L'ordre, les fenêtres de temps, les interdits.
    validations:
      required: true
  - type: textarea
    id: retour-arriere
    attributes:
      label: Retour arrière
      description: Comment défaire, étape par étape, et ce qui ne se défait pas.
    validations:
      required: true
  - type: textarea
    id: hygiene
    attributes:
      label: Hygiène
      description: "Tout ce que le ticket crée et devra effacer : un fichier temporaire, une copie d'essai, un conteneur, une branche, un dépôt ou un ticket d'essai, une séance. Une case par objet, qui dit quoi, où et pourquoi. Le chef y met ce qu'il prévoit ; le responsable ajoute une case dès qu'il crée l'objet, la coche quand il l'a effacé, ou la garde avec son motif."
      value: |
        - [ ] Quoi, où : pourquoi il existe, et quand il s'efface.
        - [ ] La séance d'exécution de ce ticket : fermée à la clôture.
    validations:
      required: true
  - type: textarea
    id: reponses
    attributes:
      label: Réponses déjà données
      description: Les questions déjà tranchées, avec qui a répondu, quand, et ses mots. Elles ne se rouvrent pas.
    validations:
      required: true
